publication_id: "EBER2025"
source_root: "原始資料/艾伯倫：奇械鍛爐"
setting: "艾伯倫"
ruleset: "2024"
canonical_mirror:
  provider: "5e.tools"
  book_id: "efa"
  url: "https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/book/book-efa.json"
  output_root: "原始資料/外部來源鏡像/EBER2025"
  datasets:
    - file: "原始資料/外部來源鏡像/PHB2024/datasets/feats.json"
      url: "https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/feats.json"
      locator_prefix: "feat:"
    - file: "原始資料/外部來源鏡像/EBER2025/datasets/spells-efa.json"
      url: "https://raw.githubusercontent.com/5etools-mirror-3/5etools-src/main/data/spells/spells-efa.json"
      locator_prefix: "spell:"
character_options:
  - "classes"
  - "subclasses"
  - "species"
  - "backgrounds"
  - "feats"
  - "spells"
  - "dependencies"
outputs:
  classes: "wiki/職業"
  species: "wiki/種族"
  feats: "wiki/專長"
  spells: "wiki/法術"
  backgrounds: "wiki/背景"
  magic_items: "wiki/魔法物品"
  settings: "wiki/戰役設定/艾伯倫"
inputs:
  classes: "第一章"
  class_sources:
    layout: "flat"
    parent:
      file: "奇械師.md"
      chinese: "奇械師"
      english: "Artificer"
    subclasses:
      - { file: "煉金師.md", chinese: "煉金師", english: "Alchemist" }
      - { file: "裝甲師.md", chinese: "裝甲師", english: "Armorer" }
      - { file: "魔炮師.md", chinese: "魔炮師", english: "Artillerist" }
      - { file: "戰地匠師.md", chinese: "戰地匠師", english: "Battle Smith" }
      - { file: "製圖師.md", chinese: "製圖師", english: "Cartographer" }
  species: "第二章"
  backgrounds: "第二章/背景"
  feats: "第二章"
  feat_sources:
    - { file: "通用專長.md", directory: "通用專長", tag: "專長_通用" }
    - { file: "龍紋專長.md", directory: "龍紋專長", tag: "專長_起源" }
    - { file: "傳奇恩惠.md", directory: "史詩恩賜專長", tag: "專長_史詩恩賜" }
  spells: "第一章/法術.md"
  magic_items_file: "附錄A：魔法物品.md"
  lore:
    include:
      - "巨龍預言.md"
      - "第四章"
      - "第五章"
      - "第六章"
      - "第七章"
    exclude:
      # 依總編輯決定，不收錄官方書籍附帶的可直接運行短劇本。
      - "第四章/敵人的敵人.md"
      - "第六章/螃蟹神殿爭奪戰.md"
parsers:
  魔法物品:
    candidate_ready: true
    parser: "scripts/ingest/ingest-magic-items.mjs"
    argument_profile: "magic_items"
    candidate_scope: "單檔附錄逐件盤點；有英文鏡像實體自身頁碼且既有頁身分唯一時，--replace 僅提出來源引註候選。新頁完整正文候選仍未支援。"
