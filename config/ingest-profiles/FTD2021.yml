        source_english: "Way of the Ascendant Dragon"
        parent_class: "武僧"
        parent_english: "Monk"
      - file: "遊俠-龍獸守衛.md"
        chinese: "龍獸守衛"
        english: "Drakewarden"
        source_english: "Drakewarden"
        parent_class: "遊俠"
        parent_english: "Ranger"
    species:
      - file: "色彩龍裔.md"
        chinese: "色彩龍裔"
        english: "Dragonborn (Chromatic)"
        source_english: "Chromatic Dragonborn"
      - file: "寶石龍裔.md"
        chinese: "寶石龍裔"
        english: "Dragonborn (Gem)"
        source_english: "Gem Dragonborn"
      - file: "金屬龍裔.md"
        chinese: "金屬龍裔"
        english: "Dragonborn (Metallic)"
