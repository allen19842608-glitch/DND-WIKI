      - "遊戲中龍/扮演龍類.md"
      - "遊戲中龍/龍之冒險.md"
parsers:
  種族:
    candidate_ready: false
    incomplete_reason: "三份龍裔變體的平鋪特質已逐項盤點，金屬龍裔未加粗的吐息特質也已按相鄰子項定位；共用種族候選器仍不支援完整平鋪正文，且英文鏡像缺各實體自身頁碼，不可生成可套用候選。"
