# 出版品註冊表
#
# 此檔是出版品身分、規則版本與本機原始來源資產的唯一註冊表。
# 它不取代各 Wiki 條目的 sources.file 與 locator：條目仍必須保有可定位來源。
# 新增資料前，先登錄出版品，再登錄每一個可引用的原始檔或原始資料目錄。
#
# `wiki.tag` 是該出版品的主要 Wiki 標籤；不適用時以 null 表示。舊標籤只能
# 留在 tag_aliases，供遷移工具辨識，不能再作為新條目的主要標籤。

